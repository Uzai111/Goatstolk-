<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goatstolk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0b0f0d;--card:#121814;--card2:#161d18;--line:#222b24;--text:#eef1ee;--sub:#9aa79e;--muted:#6d7a71;--green:#3ddc84;--green-dim:#1f5a3c;--danger:#e06a5f;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;}
h1,h2,.brand{font-family:"Barlow Condensed",Inter,sans-serif;}
button{font-family:inherit;cursor:pointer;}
.topnav{position:sticky;top:0;z-index:20;background:#0d1210;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);}
.feed{max-width:640px;margin:0 auto;padding:14px 10px 90px;}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#3a4a3f,#16211a 65%);border:1px solid #263229;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;padding:12px;}
.composer textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-family:inherit;font-size:14px;resize:vertical;min-height:44px;}
.composer-row{display:flex;gap:10px;}
.composer-tools{display:flex;align-items:center;gap:10px;margin-top:8px;}
.file-label{font-size:12.5px;color:var(--sub);border:1px solid var(--line);border-radius:16px;padding:6px 12px;}
.file-label input{display:none;}
.btn-primary{margin-left:auto;background:var(--green);color:#06170d;border:none;font-weight:700;font-size:13px;padding:8px 16px;border-radius:20px;}
.btn-primary:disabled{opacity:.4;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-size:12px;padding:5px 10px;border-radius:14px;}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.post-head .name{font-weight:700;font-size:14.5px;}
.post-head .sub{color:var(--muted);font-size:12px;}
.post-menu{margin-left:auto;display:flex;gap:6px;}
.post-text{font-size:14.5px;line-height:1.5;white-space:pre-wrap;margin:0 0 10px;}
.media{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px;background:#000;}
.media img,.media video{width:100%;max-height:480px;display:block;object-fit:cover;}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:8px 2px 6px;border-bottom:1px solid var(--line);}
.actions{display:flex;}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:8px;color:var(--sub);font-size:13px;font-weight:600;}
.act:hover{background:var(--card2);}
.act.liked{color:var(--green);}
.comments{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.comment{display:flex;gap:8px;margin-bottom:8px;}
.comment .txt{background:var(--card2);border-radius:12px;padding:6px 11px;font-size:13px;flex:1;}
.comment .txt b{display:block;font-size:12.5px;}
.comment-reply-btn{font-size:11px;color:var(--muted);margin-top:2px;cursor:pointer;}
.replies{margin-left:34px;}
.cinput{display:flex;gap:8px;margin-top:6px;}
.cinput input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:7px 12px;color:var(--text);font-size:13px;}
.cinput button{background:var(--green);color:#06170d;border:none;border-radius:16px;padding:0 13px;font-weight:700;font-size:12px;}
.authbox{max-width:360px;margin:60px auto;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;}
.authbox input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);margin-bottom:10px;font-size:14px;}
.authbox button{width:100%;background:var(--green);color:#06170d;border:none;font-weight:700;padding:10px;border-radius:8px;margin-bottom:8px;}
.authbox .switch{color:var(--sub);font-size:12.5px;text-align:center;cursor:pointer;}
.err{color:var(--danger);font-size:12.5px;margin-bottom:8px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1a221c;border:1px solid var(--line);padding:9px 16px;border-radius:20px;opacity:0;transition:.2s;z-index:30;font-size:13px;font-weight:600;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13.5px;}
.top-user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);}
</style>
</head>
<body>

<div class="topnav">
  <div class="brand"><span class="dot"></span>GOATSTOLK</div>
  <div class="top-user" id="topUser"></div>
</div>

<div id="root" class="feed"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
window.addEventListener('error', function(e){
  document.getElementById('root').innerHTML = '<div style="color:#ff8a80;padding:20px;white-space:pre-wrap;font-size:13px;font-family:monospace;">ERROR: '+e.message+'\n'+(e.error&&e.error.stack?e.error.stack:'')+'</div>';
});
window.addEventListener('unhandledrejection', function(e){
  var msg = (e.reason && e.reason.message) ? e.reason.message : JSON.stringify(e.reason);
  document.getElementById('root').innerHTML = '<div style="color:#ff8a80;padding:20px;white-space:pre-wrap;font-size:13px;font-family:monospace;">PROMISE ERROR: '+msg+'</div>';
});
// ---- Supabase connection (your real project) ----
const sb = window.supabase.createClient(
  'https://zgczpblpawehvihscfgm.supabase.co',
  'sb_publishable_oH_i21pNdWHv-puIbk40xA_CaWDZJkx'
);

let session = null;
let profile = null;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return (s||'').replace(/</g,'&lt;');}
function timeAgo(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

// ---------------- AUTH ----------------
async function ensureProfile(){
  const {data} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(data){ profile = data; return; }
  const uname = (session.user.email||'user').split('@')[0] + Math.floor(Math.random()*1000);
  const {data:created, error} = await sb.from('profiles').insert({id:session.user.id, username:uname}).select().single();
  if(error){ console.error(error); }
  profile = created;
}

function renderAuth(){
  document.getElementById('topUser').innerHTML='';
  document.getElementById('root').innerHTML = `
    <div class="authbox">
      <h2 id="authTitle" style="margin-top:0;">Log in to Goatstolk</h2>
      <div class="err" id="authErr"></div>
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPass" placeholder="Password">
      <button id="authSubmit">Log In</button>
      <div class="switch" id="authSwitch">New here? Create an account</div>
    </div>`;
  let mode='login';
  document.getElementById('authSwitch').onclick=()=>{
    mode = mode==='login' ? 'signup' : 'login';
    document.getElementById('authTitle').textContent = mode==='login' ? 'Log in to Goatstolk' : 'Create your Goatstolk account';
    document.getElementById('authSubmit').textContent = mode==='login' ? 'Log In' : 'Sign Up';
    document.getElementById('authSwitch').textContent = mode==='login' ? 'New here? Create an account' : 'Already have an account? Log in';
  };
  document.getElementById('authSubmit').onclick = async ()=>{
    const email=document.getElementById('authEmail').value.trim();
    const password=document.getElementById('authPass').value;
    const errBox=document.getElementById('authErr'); errBox.textContent='';
    if(!email||!password){errBox.textContent='Enter an email and password.';return;}
    const fn = mode==='login' ? sb.auth.signInWithPassword({email,password}) : sb.auth.signUp({email,password});
    const {data,error} = await fn;
    if(error){ errBox.textContent=error.message; return; }
    if(mode==='signup' && !data.session){ errBox.textContent='Check your email to confirm your account, then log in.'; return; }
    session = data.session;
    await ensureProfile();
    init();
  };
}

// ---------------- FEED ----------------
async function loadPosts(){
  const {data:posts, error} = await supabase
    .from('posts')
    .select('*, profiles(username,avatar_url), reactions(user_id), comments(id,body,author_id,parent_comment_id,created_at,profiles(username))')
    .eq('is_deleted', false)
    .order('created_at', {ascending:false});
  if(error){ console.error(error); return []; }
  return posts;
}

function postMediaHtml(p){
  if(!p.media_url) return '';
  if(p.media_type==='video') return `<div class="media"><video src="${p.media_url}" controls playsinline></video></div>`;
  return `<div class="media"><img src="${p.media_url}" loading="lazy"></div>`;
}

function commentsHtml(comments, postId){
  const top = comments.filter(c=>!c.parent_comment_id);
  const repliesOf = pid => comments.filter(c=>c.parent_comment_id===pid);
  const renderC = c => `
    <div class="comment">
      <div class="avatar" style="width:28px;height:28px;"></div>
      <div style="flex:1">
        <div class="txt"><b>${esc(c.profiles?.username||'user')}</b>${esc(c.body)}</div>
        <div class="comment-reply-btn" data-reply="${c.id}" data-post="${postId}">Reply</div>
        <div class="replies">
          ${repliesOf(c.id).map(renderC).join('')}
        </div>
      </div>
    </div>`;
  return top.map(renderC).join('') || '';
}

function renderFeed(posts){
  const root = document.getElementById('root');
  if(!posts.length){ root.innerHTML = '<div class="empty">No posts yet. Be the first to post.</div>'; }
  root.innerHTML = `
    <div class="card composer">
      <div class="composer-row">
        <div class="avatar"></div>
        <textarea id="composerText" placeholder="Share a take, a photo, or a match moment..."></textarea>
      </div>
      <div class="composer-tools">
        <label class="file-label">📷 Photo<input type="file" accept="image/*" id="photoInput"></label>
        <label class="file-label">🎬 Video<input type="file" accept="video/*" id="videoInput"></label>
        <button class="btn-primary" id="composerBtn">Post</button>
      </div>
      <div id="mediaPreviewName" style="font-size:11.5px;color:var(--muted);margin-top:6px;"></div>
    </div>
    <div id="postsHost"></div>
  ` + root.innerHTML.includes('empty') && !posts.length ? root.innerHTML : '';

  root.querySelector('#postsHost') && (root.querySelector('#postsHost').innerHTML = posts.map(p=>{
    const likeCount = p.reactions.length;
    const iLiked = p.reactions.some(r=>r.user_id===session.user.id);
    const isMine = p.author_id===session.user.id;
    return `
    <div class="card post" data-post="${p.id}">
      <div class="post-head">
        <div class="avatar"></div>
        <div>
          <div class="name">${esc(p.profiles?.username||'user')}</div>
          <div class="sub">${timeAgo(p.created_at)}</div>
        </div>
        ${isMine ? `<div class="post-menu"><button class="btn-ghost" data-edit="${p.id}">Edit</button><button class="btn-ghost" data-del="${p.id}">Delete</button></div>` : `<div class="post-menu"><button class="btn-ghost" data-report="${p.id}">Report</button></div>`}
      </div>
      <p class="post-text" id="text-${p.id}">${esc(p.body)}</p>
      ${postMediaHtml(p)}
      <div class="stats"><span>${likeCount} reactions · ${p.comments.length} comments</span></div>
      <div class="actions">
        <div class="act like-btn ${iLiked?'liked':''}" data-like="${p.id}" data-liked="${iLiked}">👍 Like</div>
        <div class="act comment-toggle" data-toggle="${p.id}">💬 Comment</div>
        <div class="act share-btn" data-share="${p.id}">↗ Share</div>
      </div>
      <div class="comments" id="comments-${p.id}" style="display:none;">
        ${commentsHtml(p.comments, p.id)}
        <div class="cinput"><input type="text" placeholder="Write a comment..." data-cinput="${p.id}"><button data-csend="${p.id}">Send</button></div>
      </div>
    </div>`;
  }).join(''));

  wireFeedEvents(posts);
}

function wireFeedEvents(posts){
  document.getElementById('composerBtn').onclick = submitPost;

  document.querySelectorAll('.like-btn').forEach(el=>{
    el.onclick = async ()=>{
      const postId = el.dataset.like;
      const liked = el.dataset.liked==='true';
      if(liked){
        await sb.from('reactions').delete().eq('post_id',postId).eq('user_id',session.user.id);
      } else {
        await sb.from('reactions').insert({post_id:postId,user_id:session.user.id,type:'like'});
      }
      refresh();
    };
  });

  document.querySelectorAll('.comment-toggle').forEach(el=>{
    el.onclick = ()=>{
      const box = document.getElementById('comments-'+el.dataset.toggle);
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    };
  });

  document.querySelectorAll('[data-csend]').forEach(el=>{
    el.onclick = ()=> sendComment(el.dataset.csend, null);
  });
  document.querySelectorAll('[data-cinput]').forEach(el=>{
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') sendComment(el.dataset.cinput, null); });
  });
  document.querySelectorAll('[data-reply]').forEach(el=>{
    el.onclick = ()=>{
      const postId = el.dataset.post, parentId = el.dataset.reply;
      const val = prompt('Reply:');
      if(val && val.trim()) sendComment(postId, parentId, val.trim());
    };
  });

  document.querySelectorAll('[data-share]').forEach(el=>{
    el.onclick = async ()=>{
      await sb.from('shares').insert({post_id:el.dataset.share, user_id:session.user.id});
      toast('Shared to your profile');
    };
  });

  document.querySelectorAll('[data-report]').forEach(el=>{
    el.onclick = async ()=>{
      const reason = prompt('Why are you reporting this post?');
      if(!reason) return;
      await sb.from('reports').insert({post_id:el.dataset.report, reporter_id:session.user.id, reason});
      toast('Report submitted');
    };
  });

  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Delete this post?')) return;
      await sb.from('posts').update({is_deleted:true}).eq('id',el.dataset.del);
      refresh();
    };
  });

  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = async ()=>{
      const id=el.dataset.edit;
      const cur = document.getElementById('text-'+id).textContent;
      const val = prompt('Edit post:', cur);
      if(val===null) return;
      await sb.from('posts').update({body:val, updated_at:new Date().toISOString()}).eq('id',id);
      refresh();
    };
  });
}

async function sendComment(postId, parentId, forcedVal){
  const input = document.querySelector(`[data-cinput="${postId}"]`);
  const val = forcedVal || (input ? input.value.trim() : '');
  if(!val) return;
  await sb.from('comments').insert({post_id:postId, author_id:session.user.id, body:val, parent_comment_id:parentId||null});
  if(input) input.value='';
  refresh();
}

async function submitPost(){
  const text = document.getElementById('composerText').value.trim();
  const photo = document.getElementById('photoInput').files[0];
  const video = document.getElementById('videoInput').files[0];
  if(!text && !photo && !video){ toast('Write something or add media'); return; }
  const btn = document.getElementById('composerBtn'); btn.disabled=true; btn.textContent='Posting…';

  let media_url=null, media_type=null;
  const file = photo || video;
  if(file){
    const path = `${session.user.id}/${Date.now()}_${file.name}`;
    const {error:upErr} = await sb.storage.from('post-media').upload(path, file);
    if(upErr){ toast('Upload failed: '+upErr.message); btn.disabled=false; btn.textContent='Post'; return; }
    const {data:pub} = sb.storage.from('post-media').getPublicUrl(path);
    media_url = pub.publicUrl;
    media_type = photo ? 'photo' : 'video';
  }

  const {error} = await sb.from('posts').insert({author_id:session.user.id, body:text, media_url, media_type});
  btn.disabled=false; btn.textContent='Post';
  if(error){ toast('Post failed: '+error.message); return; }
  toast('Posted');
  refresh();
}

async function refresh(){
  const posts = await loadPosts();
  renderFeed(posts);
}

// ---------------- INIT ----------------
async function init(){
  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  if(!session){ renderAuth(); return; }
  if(!profile) await ensureProfile();
  document.getElementById('topUser').innerHTML = `@${esc(profile?.username||'')} <button class="btn-ghost" id="logoutBtn">Log out</button>`;
  document.getElementById('logoutBtn').onclick = async ()=>{ await sb.auth.signOut(); session=null; profile=null; renderAuth(); };
  await refresh();

  // realtime: live-refresh when anyone posts/reacts/comments
  sb.channel('feed-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'posts'}, refresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'reactions'}, refresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'comments'}, refresh)
    .subscribe();
}

init();
</script>
</body>
</html>
